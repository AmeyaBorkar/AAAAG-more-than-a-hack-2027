name: possession_control_v1_hw12
description: >
  #58 arm B: as possession_control_v1 (ballstate_v1_team with `nearest_player` replaced by
  `control_possession`), plus a 0.5 s dead-gated vote (half_window 12) on top of the hold.
evidence:
  - name: control_possession
    params: {reach_m: 1.0, hold_frames: 3}
  - name: ballstate
fusion:
  name: factorised
  params: {dead_from: [ballstate], team_first_from: [ballstate]}
decoder:
  name: dead_gated_vote
  params: {half_window: 12, min_dead_s: 2.0, min_alive_s: 1.0}
