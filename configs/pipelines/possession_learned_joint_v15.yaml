name: possession_learned_joint_v15
description: >
  Candidate v15 (#86): v14 with SGG'' soup networks (1/2 W + 1/6 each of three A25G25 seeds, production) and decode switch_weight 1.5, touch_snap 0.25 s (E129b, E136). Candidate v14 (#86): v12 with the E99 W production networks (PFF-pretrained, d_model 128, E56a recipe, E92 C fine-tune). v12 (#86): v11b with the E84 fine-tuned production networks (visible dead ball, from their own weights). v11b (#86): v11 with dead_threshold 0.30 (E72, E72b). v11 (#86): v10 retrained on seven IDSSE matches after the exam (E65). v10 (#86): v9 with the E56a network (E29b plus restart_blank training, three seeds on the five IDSSE dev matches). v9: v8 with keep_restart (E61): the spell that opens play after a stoppage is kept. v8: v7 with pre_kickoff_dead moved first (E55b), so a possession the cut leaves behind meets
  the touch snap and the convention step like any other. v7: v5 plus D before each opening kick-off (E55). v5: v4 with the controlled-possession rule. E29b: control memory plus the contact columns (E17), the possessor head (E18) and a learned
  switch head (E19), trained with wide ball smoothing (E28), three seeds trained on the five IDSSE dev matches
  (logits averaged) and two mirrored views, both heads through
  factorised fusion, the dead-gated semi-Markov decoder with a 0.4 dead threshold and a switch bonus at weight 2,
  then the gaining-team touch snap and the controlled-possession rule (controlled_spell 1.5, E40c; it equals min_spell 1.5 where no pass is seen). Dev
  (leave-one-match-out fold models, seeds 5-9) against E19: clean -0.0004 (seeds 0+1) and -0.0046 (seeds 2+3)
  on the three-truth mean; on an 8-frame-smoothed ball (S8, a smoothing stress) +0.061 and +0.057. The fall-back stays possession_control_v1_hw12; v3 stays a YAML swap.
evidence:
- name: learned_team
  params:
    backend: numpy
    weights: [models/v15sggpp_all7_seed2.json, models/v15sggpp_all7_seed3.json, models/v15sggpp_all7_seed4.json]
    sha256: [cd80e3c0118b300c, c473e3cadde35ecd, d21efe73f7dbc32d]
    output: joint
    views: 2
    workers: 4
fusion:
  name: factorised
  params: {dead_from: [learned_team], team_from: [learned_team]}
decoder:
  name: dead_gated_hsmm
  params: {lam_team: 0.6, beta: 0.0, refine_s: 0.0, dead_threshold: 0.3, switch_weight: 1.5}
postprocess:
- name: pre_kickoff_dead
  params: {source: anchors}
- name: touch_snap
