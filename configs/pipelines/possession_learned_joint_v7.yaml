# Candidate v7 (#86, E55): v5 plus `pre_kickoff_dead` as the last step. No team has the ball before a period
# kicks off; the organisers' FAQ says the 2,934 graded frames before the second-half kick-off are all D, and
# v5 calls a team on most of them. The kick-off frames are the organisers' anchors in games.py (AGENTS.md rule
# 2 allows only that metadata); matches without anchors (every external match) are unchanged, so every
# validation suite is byte-identical to v5.
name: possession_learned_joint_v7
description: >
  Candidate v7 (#86): v5 plus D before each period's opening kick-off (pre_kickoff_dead, the organisers'
  kick-off anchors in games.py; E55). v5: v4 with the controlled-possession rule. E29b: control memory plus the contact columns (E17), the possessor head (E18) and a learned
  switch head (E19), trained with wide ball smoothing (E28), three seeds trained on the five IDSSE dev matches
  (logits averaged) and two mirrored views, both heads through
  factorised fusion, the dead-gated semi-Markov decoder with a 0.4 dead threshold and a switch bonus at weight 2,
  then the gaining-team touch snap and the controlled-possession rule (controlled_spell 1.5, E40c; it equals min_spell 1.5 where no pass is seen). Dev
  (leave-one-match-out fold models, seeds 5-9) against E19: clean -0.0004 (seeds 0+1) and -0.0046 (seeds 2+3)
  on the three-truth mean; on an 8-frame-smoothed ball (S8, a smoothing stress) +0.061 and +0.057. The fall-back stays possession_control_v1_hw12; v3 stays a YAML swap.
evidence:
- name: learned_team
  params:
    backend: numpy
    weights: [models/csb_all5_seed0.json, models/csb_all5_seed1.json, models/csb_all5_seed2.json]
    sha256: [e4de2f0843487d18, ef3d0efb724effe0, cb3d0ddf5e5ead9d]
    output: joint
    views: 2
    workers: 4
fusion:
  name: factorised
  params: {dead_from: [learned_team], team_from: [learned_team]}
decoder:
  name: dead_gated_hsmm
  params: {lam_team: 0.6, beta: 0.0, refine_s: 0.0, dead_threshold: 0.4, switch_weight: 2.0}
postprocess:
- name: touch_snap
  params: {window_s: 2.0}
- name: controlled_spell
  params: {hold_s: 1.5, reach_m: 1.0, min_players: 2, min_sep_m: 0.0}
- name: pre_kickoff_dead
  params: {source: anchors}
