  matches and settings otherwise. Written for the confirmation run of #69 before it ran, so
  that a setting picked on seeds 0-4 (#66) is tested on draws it never saw. Fetch first:
  python -m aaaag.sources.idsse J03WMX J03WOH J03WOY J03WPY J03WR9
