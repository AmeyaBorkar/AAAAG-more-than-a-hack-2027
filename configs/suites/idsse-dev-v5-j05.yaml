name: idsse-dev-v5-j05
description: >
  Robustness rung of idsse-dev-v5 (#50): as idsse-dev-v5, with both ends of every hidden stoppage
  shifted independently by U(-0.5, +0.5) s, in case BAR-ATH blanks the dead ball less exactly than
  Metrica. Declared before any run. Fetch first:
  python -m aaaag.sources.idsse J03WMX J03WOH J03WOY J03WPY J03WR9
