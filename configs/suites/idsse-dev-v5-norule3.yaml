name: idsse-dev-v5-norule3
description: >
  Harsher rung of idsse-dev-v5 (#62): IDSSE dev degraded by degrade-v5n, the v5 fit on Metrica
  WITHOUT rule 3, so Metrica's long event-free gaps count as alive gaps (live play with the ball
  missing), in case they are live play after all. It bounds a bet that a missing ball means a
  dead one. Declared and frozen before any run of #62's arms. Fetch first:
  python -m aaaag.sources.idsse J03WMX J03WOH J03WOY J03WPY J03WR9
matches:
  - {name: idsse, params: {match_id: J03WMX, degrade: {version: '5n', seed: 0}}}
  - {name: idsse, params: {match_id: J03WMX, degrade: {version: '5n', seed: 1}}}
  - {name: idsse, params: {match_id: J03WMX, degrade: {version: '5n', seed: 2}}}
