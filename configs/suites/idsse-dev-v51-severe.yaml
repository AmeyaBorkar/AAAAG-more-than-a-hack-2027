  "severe" (#73, configs/degrade/degrade-v51-severe.yaml): physical priors, nothing from BAR-ATH. A
  robustness check for pipelines that read player positions near the ball. Fetch first:
  python -m aaaag.sources.idsse J03WMX J03WOH J03WOY J03WPY J03WR9
