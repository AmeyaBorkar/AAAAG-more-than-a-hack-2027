name: idsse-dev-v2
description: >
  THE SELECTOR (docs/VALIDATION.md, Tier 1): the five IDSSE dev matches x five seeds of degrade-v2,
  i.e. the ball dropped in BAR-ATH-like blocks with context-dependent starts, a frozen ball counted
  as open play (configs/degrade/degrade-v2.yaml, issue #21). Track slots stay clean. Provisional
  until the adversarial realism check (arnav-10) is reported. Fetch first:
  python -m aaaag.sources.idsse J03WMX J03WOH J03WOY J03WPY J03WR9
matches:
